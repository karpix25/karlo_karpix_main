services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - PIP_DISABLE_PIP_VERSION_CHECK=1
    environment:
      - APP_NAME=${APP_NAME:-VACA Backend}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - DB_PATH=${DB_PATH:-/data/vaca.db}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-ru}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_INITDATA_MAX_AGE_SECONDS=${TELEGRAM_INITDATA_MAX_AGE_SECONDS:-3600}
      - AUTH_ALLOW_INSECURE_DEV=${AUTH_ALLOW_INSECURE_DEV:-false}
      - ADMIN_USER_ID=${ADMIN_USER_ID:-0}
      - USERBOT_SECRETS_KEY=${USERBOT_SECRETS_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - NINE_ROUTER_API_KEY=${NINE_ROUTER_API_KEY:-}
      - NINE_ROUTER_BASE_URL=${NINE_ROUTER_BASE_URL:-https://api.9router.com/v1}
      - NINE_ROUTER_MODEL=${NINE_ROUTER_MODEL:-}
      - NINE_ROUTER_HTTP_REFERER=${NINE_ROUTER_HTTP_REFERER:-}
      - NINE_ROUTER_X_TITLE=${NINE_ROUTER_X_TITLE:-VACA}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_X_TITLE=${OPENROUTER_X_TITLE:-VACA}
      - TELETHON_API_ID=${TELETHON_API_ID:-0}
      - TELETHON_API_HASH=${TELETHON_API_HASH:-}
      - TELETHON_SESSION=${TELETHON_SESSION:-vaca_userbot}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - SCHEDULER_INTERVAL_MINUTES=${SCHEDULER_INTERVAL_MINUTES:-30}
    volumes:
      - backend_data:/data
    expose:
      - '8000'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE=/api
        - VITE_ALLOW_INSECURE_DEV=false
        - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-http://backend:8000}
    expose:
      - '80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
